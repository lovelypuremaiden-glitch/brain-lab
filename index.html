<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRAIN LAB 2.2</title><style>body{background:#101d32;color:#eefaff;font:18px system-ui;margin:auto;max-width:760px;padding:24px}h1,h2{color:#83e5df}button,input,textarea{font:inherit;padding:12px;border-radius:10px;border:1px solid #54718a}button{background:#263e59;color:white;cursor:pointer;margin:5px;min-height:48px}button:hover{background:#365873}section{background:#1a3049;padding:20px;border-radius:14px;margin:15px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}svg{width:100%;background:white;border-radius:12px;pointer-events:none}small{color:#b9d6e4}.stim{text-align:center;font-size:70px;font-weight:bold;padding:25px}.bar{background:#334b64;height:14px;border-radius:8px}.bar i{display:block;background:#83e5df;height:100%;border-radius:8px}textarea{width:90%} .sliderbox{background:#203e54;border:2px solid #83e5df;border-radius:16px;padding:16px;margin:18px 0}.sliderbox label{display:block;font-weight:bold;color:#a5fff5}.sliderbox input[type=range]{appearance:none;-webkit-appearance:none;display:block;width:100%;box-sizing:border-box;height:48px;padding:0;border:0;background:transparent;cursor:ew-resize;touch-action:pan-y}.sliderbox input::-webkit-slider-runnable-track{height:12px;background:#83e5df;border-radius:12px}.sliderbox input::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:32px;height:32px;border:3px solid white;background:#ffb45e;border-radius:50%;margin-top:-10px}.sliderbox input::-moz-range-track{height:12px;background:#83e5df;border-radius:12px}.sliderbox input::-moz-range-thumb{width:28px;height:28px;border:3px solid white;background:#ffb45e;border-radius:50%}.ends{display:flex;justify-content:space-between;font-size:14px}.sliderbox button{min-width:60px}</style><main id="app"></main><script>
const app=document.querySelector('#app'), names=['色のワナ','錯視のワナ','記憶のワナ','思い込みのワナ','直感のワナ','自分の脳を知る'], icons=['🎨','👁️','🧠','🔍','⚡','📊'], notes=['文字を読む処理と色を答える処理が干渉することがあります（ストループ効果）。','周囲の情報は大きさや長さ、明るさの知覚に影響します。','意味的に関連する情報を実際に見たと誤って判断することがあります（偽りの記憶）。','予想に反する例も調べることが大切です（確証バイアス）。','直感は便利ですが、必要に応じて分析的に考え直すことも大切です。','自分の認知活動を把握し調整する働きをメタ認知といいます。'], reflections=['別の情報に気を取られた経験は？','同じものが違って見えることから何を学んだ？','記憶を確かめるには？','別の見方をするには？','考え直すとよい場面は？','判断を確かめるには？'];let done={},records={},timer;const $=id=>document.getElementById(id);function show(s){clearInterval(timer);app.innerHTML=s}function btn(id,t,f){let b=document.createElement('button');b.textContent=t;b.onclick=f;$(id).append(b)}function screen(i,s){show('<div id="nav"></div><small>LAB 0'+(i+1)+'</small><h2>'+icons[i]+' '+names[i]+'</h2>'+s);btn('nav','⌂ 研究所へ戻る',home)}function opts(a,f){a.forEach((v,j)=>btn('opts',v,()=>f(j)))}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function home(){show('<h1>🧠 BRAIN LAB</h1><p>脳の不思議研究所 / Ver.2.3 HTML版</p><section>実験完了 '+Object.keys(done).length+' / 6</section><div id="menu" class="grid"></div><div id="ref"></div><small>心理検査ではありません。記録はページを閉じると消えます。</small>');names.forEach((v,i)=>btn('menu',icons[i]+' '+v+(done[i]?' ✓':''),()=>[color,vision,memory,think,intuition,meta][i]()));btn('ref','参考文献',()=>{show('<h2>参考文献</h2><p>服部雅史・小島治幸・北神慎司（2025）『基礎から学ぶ認知心理学〔改訂版〕―人間の認識の不思議』有斐閣．</p><p>杉原厚吉（2018）『新 錯視図鑑―脳がだまされる奇妙な世界を楽しむ・解き明かす・つくりだす』誠文堂新光社．</p><p>上記文献を参考に、生成AI（ChatGPT）を活用して教材を作成。</p><div id="back"></div>');btn('back','戻る',home)})}function finish(i,s){done[i]=true;screen(i,'<h2>実験完了！</h2>'+s+'<section><small>SCIENCE NOTE</small><p>'+notes[i]+'</p></section><section><small>REFLECTION</small><p>'+reflections[i]+'</p><textarea placeholder="気づいたこと（任意）"></textarea></section>')}function conf(i,f){screen(i,'<p>今の答えにどのくらい自信がある？</p><div id="opts" class="grid"></div>');opts(['0%','25%','50%','75%','100%'],j=>f(j*25))}function bar(n){return '<div class="bar"><i style="width:'+n+'%"></i></div>'}
function color(){let w=['赤','青','緑','黄'],h=['#ff6977','#67aaff','#57df99','#ffdc54'],q=shuffle(Array.from({length:24},(_,i)=>{let c=i%4,t=Math.floor(i/4)%3;return {c,t,w:t===0?c:t===1?(c+1+Math.floor(Math.random()*3))%4:-1}})),n=0,r=[];function ask(){let a=q[n];screen(0,'<small>'+(n+1)+'/24</small><p>文字そのものの色を選んでね。</p><div class="stim" style="color:'+h[a.c]+'">'+(a.w<0?'XXXX':w[a.w])+'</div><div id="opts" class="grid"></div>');let start=performance.now();opts(w,j=>{r.push({t:a.t,ok:j===a.c,ms:performance.now()-start});if(++n<24)ask();else end()})}function end(){let s=[0,1,2].map(t=>{let a=r.filter(x=>x.t===t&&x.ok);return {n:a.length,ms:a.length?Math.round(a.reduce((v,x)=>v+x.ms,0)/a.length):0}}),max=Math.max(1,...s.map(x=>x.ms));finish(0,'<section><h3>平均反応時間</h3>'+s.map((x,i)=>'<p>'+['一致','不一致','中立'][i]+'：'+(x.n?x.ms+' ms':'測定なし')+' ／ 正答 '+x.n+'/8</p>'+bar(x.ms/max*100)).join('')+'<small>正答のみの平均。端末や操作の影響を含む簡易測定。</small></section>')}screen(0,'<p>文字の意味ではなく色を答えよう。全24問。</p><div class="stim" style="color:#67aaff">赤</div><p>この場合は青が正解。</p><div id="go"></div>');btn('go','開始',ask)}
function vision(){let n=0,r=20,hide=false,rows=[],titles=['エビングハウス錯視','ミュラー・リヤー錯視','ポンゾ錯視','明るさの対比'];function draw(){let s='';if(n===0){if(!hide){for(let i=0;i<6;i++){let a=i*Math.PI/3;s+=`<circle cx="${80+(r+25)*Math.cos(a)}" cy="${90+(r+25)*Math.sin(a)}" r="${r}" fill="#8493a4"/>`}for(let i=0;i<8;i++){let a=i*Math.PI/4;s+=`<circle cx="${240+33*Math.cos(a)}" cy="${90+33*Math.sin(a)}" r="8" fill="#8493a4"/>`}}s+='<circle cx="80" cy="90" r="17" fill="#ef9142"/><circle cx="240" cy="90" r="17" fill="#ef9142"/>'}if(n===1){s='<path d="M85 50H235 M85 130H235" stroke="#222" stroke-width="3"/>';if(!hide)s+=`<path d="M115 ${50-r}L85 50L115 ${50+r} M205 ${50-r}L235 50L205 ${50+r} M55 ${130-r}L85 130L55 ${130+r} M265 ${130-r}L235 130L265 ${130+r}" fill="none" stroke="#222" stroke-width="2"/>`}if(n===2){if(!hide)s+=`<path d="M${160-r} 5L10 175 M${160+r} 5L310 175" fill="none" stroke="#456" stroke-width="3"/>`;s+='<rect x="110" y="45" width="100" height="10" fill="#ef9142"/><rect x="110" y="125" width="100" height="10" fill="#ef9142"/>'}if(n===3)s=`<rect x="5" y="10" width="150" height="160" fill="${hide?'#999':`rgb(${r},${r},${r})`}"/><rect x="165" y="10" width="150" height="160" fill="${hide?'#999':'#eee'}"/><rect x="50" y="60" width="60" height="60" fill="#808080"/><rect x="210" y="60" width="60" height="60" fill="#808080"/>`;$('drawing').innerHTML='<svg viewBox="0 0 320 180">'+s+'</svg>'}function ask(){hide=false;r=[22,25,12,25][n];screen(1,'<h3>'+titles[n]+' ('+(n+1)+'/4)</h3><p>'+['中央の円はどちらが大きい？','水平線はどちらが長い？','オレンジの棒はどちらが長い？','中央の灰色はどちらが明るい？'][n]+'</p><div id="drawing"></div><div id="opts" class="grid"></div>');draw();opts(n===1||n===2?['上','下','同じ']:['左','右','同じ'],j=>conf(1,c=>{rows.push({ok:j===2,c});reveal()}))}function reveal(){screen(1,'<h3>実は同じです！</h3><div id="drawing"></div><div class="sliderbox"><label for="range">↔ '+['周囲の円の大きさ','矢羽根の角度','背景の線の開き','左側の背景の明るさ'][n]+'</label><p>オレンジの丸を左右に動かしてみよう！</p><input id="range" type="range" min="5" max="'+[28,40,100,255][n]+'" value="'+r+'"><div class="ends"><span>小さい値</span><span>大きい値</span></div><div id="adjust"></div></div><div id="actions"></div>');draw();function update(v){r=Math.max(5,Math.min([28,40,100,255][n],v));$('range').value=r;hide=false;draw()}$('range').oninput=e=>update(+e.target.value);btn('adjust','−',()=>update(r-[2,3,5,15][n]));btn('adjust','＋',()=>update(r+[2,3,5,15][n]));btn('adjust','元に戻す',()=>update([22,25,12,25][n]));btn('actions','周囲の条件を取り除く／戻す',()=>{hide=!hide;draw()});btn('actions','次へ',()=>{if(++n===4){records[1]=rows;finish(1,'<p>4種類の錯視を観察しました。</p>')}else ask()})}ask()}
function memory(){let w=['枕','布団','夢','ベッド','夜','まぶた','あくび','毛布','休息','寝室','うとうと','いびき'],q=shuffle(['枕','夢','睡眠','時計','布団','机','夜','毛布','眠る','寝室']),n=0,r=[];screen(2,'<p>提示時間を選ぼう。</p><div id="opts"></div>');opts(['10秒','15秒','20秒','30秒'],j=>{let s=[10,15,20,30][j];screen(2,'<p>残り <b id="sec">'+s+'</b> 秒</p><section class="grid">'+w.map(x=>'<p>'+x+'</p>').join('')+'</section>');let start=Date.now();timer=setInterval(()=>{let left=Math.max(0,s-Math.floor((Date.now()-start)/1000));$('sec').textContent=left;if(!left)ask()},100)});function ask(){screen(2,'<small>'+(n+1)+'/10</small><div class="stim" style="font-size:40px">'+q[n]+'</div><p>一覧にあった？</p><div id="opts"></div>');opts(['あった','なかった'],j=>conf(2,c=>{r.push({word:q[n],ok:(j===0)===w.includes(q[n]),c});if(++n<q.length)ask();else{records[2]=r;finish(2,'<section>正答 '+r.filter(x=>x.ok).length+'/10'+r.map(x=>'<p>'+x.word+'：'+(w.includes(x.word)?'提示あり':'提示なし')+' ／ '+(x.ok?'○':'×')+'</p>').join('')+'<p>睡眠・眠るは提示していない関連語です。</p></section>')}}))}}
function think(){let logs=[];screen(3,'<p>秘密のルールに「2・4・6」は当てはまります。好きな3つの整数で実験しよう。</p><section><input id="a" type="number" value="4" style="width:20%"><input id="b" type="number" value="6" style="width:20%"><input id="c" type="number" value="8" style="width:20%"><div id="test"></div><div id="log"></div></section><p>秘密のルールは？</p><div id="opts"></div>');btn('test','実験する',()=>{let raw=['a','b','c'].map(x=>$(x).value),a=raw.map(Number);if(raw.some(x=>!x)||a.some(x=>!Number.isInteger(x)))return;logs.push(a.join('・')+' → '+(a[0]<a[1]&&a[1]<a[2]?'当てはまる ✓':'当てはまらない ×'));$('log').textContent=logs.join('\n');$('log').style.whiteSpace='pre-line'});opts(['偶数が並ぶ','2ずつ増える','順に大きくなる','すべて同じ数'],j=>conf(3,c=>{records[3]=[{ok:j===2,c}];finish(3,'<section>正解：順に大きくなる<p>実験回数：'+logs.length+'</p><p>1・3・8は当てはまり、6・4・2は当てはまりません。</p></section>')}))}
function intuition(){let q=[['ノートとペンの合計は110円。ノートはペンより100円高い。ペンはいくら？',['10円','5円','15円','20円'],1,'ペンが10円なら合計は？','5円＋105円＝110円'],['3台の機械が3分で3個の製品を作ります。同じ性能の9台が同時に9個作るには？',['9分','1分','3分','27分'],2,'1台が1個を作る時間は？','1台が3分で1個作るので9台でも3分。'],['水草が毎日2倍に増え、20日目に池全体を覆いました。半分を覆ったのは？',['10日目','15日目','19日目','18日目'],2,'全体を覆う前日は？','前日の2倍で全体になるので19日目。']],n=0,r=[];function ask(){let a=q[n];screen(4,'<section>'+a[0]+'</section><p>直感で答えよう。</p><div id="opts"></div>');opts(a[1],j=>conf(4,c=>{screen(4,'<section>'+a[0]+'<p>ヒント：'+a[3]+'</p></section><p>考え直してみよう。</p><div id="opts"></div>');opts(a[1],k=>{r.push({ok:j===a[2],c,second:k===a[2]});screen(4,'<section>正解：'+a[1][a[2]]+'<p>'+a[4]+'</p><p>直感：'+a[1][j]+' ／ 熟考：'+a[1][k]+'</p></section><div id="next"></div>');btn('next','次へ',()=>{if(++n<q.length)ask();else{records[4]=r;finish(4,'<section>直感：'+r.filter(x=>x.ok).length+'/3<p>熟考：'+r.filter(x=>x.second).length+'/3</p></section>')}})})}))}ask()}
function meta(){let g=Object.entries(records);if(!g.length){screen(5,'<p>先に錯視・記憶・思い込み・直感の実験をしてね。</p>');return}let all=g.flatMap(x=>x[1]),avg=a=>Math.round(a.reduce((s,x)=>s+x.c,0)/a.length),acc=a=>Math.round(a.filter(x=>x.ok).length/a.length*100);finish(5,'<section>平均自信度：'+avg(all)+'%'+bar(avg(all))+'<p>正答率：'+acc(all)+'%</p>'+bar(acc(all))+g.map(([i,a])=>'<p>'+names[i]+'：自信度 '+avg(a)+'% ／ 正答率 '+acc(a)+'%</p>').join('')+'<small>色のワナは集計対象外。直感は最初の回答を集計。能力や性格の診断ではありません。</small></section>')}home();
